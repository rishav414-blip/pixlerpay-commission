name: Paynix wallet top-up alert

# Fast, frequent check limited to per-merchant wallet "Load Requests"
# (top-up) logs — no reseller-dashboard/failed-payout scrape here, see
# the "no longer runs download-paynix" comment below for why. The real
# schedule is an external cron (cron-job.org) hitting workflow_dispatch
# every 5 min, since GitHub's native `schedule:` trigger was found
# 2026-08-07 to silently run at ~2.5-3hr intervals regardless of the cron
# expression below — this native schedule is kept only as a passive
# backstop. Failed-payout checks run on their own cadence (refresh.yml,
# externally triggered every 15 min).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

concurrency:
  # Own group, separate from refresh.yml (was: shared "paynix-pipeline")
  # — since download-paynix.js/failed-payout data is no longer touched
  # here, the two workflows no longer need to serialize against each
  # other. Splitting them stops wallet-alert's frequent (5-min) dispatches
  # from queuing behind refresh.yml's longer runs and getting cancelled
  # (confirmed happening 2026-08-07). Residual risk: a wallet-alert upload
  # finishing after a refresh.yml upload can briefly overwrite the
  # dashboard's merchants/failed-payout *display* data with a slightly
  # older snapshot — cosmetic only, doesn't affect alert correctness.
  # Still self-serialized against overlapping wallet-alert runs.
  group: wallet-alert-pipeline
  cancel-in-progress: false

jobs:
  wallet-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # See refresh.yml for why: caches the Chromium download itself so
      # this fast/frequent (every 10 min) job isn't re-downloading the
      # browser from scratch every cycle.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Write credential files from secrets
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          PAYNIX_MERCHANT_LOGINS: ${{ secrets.PAYNIX_MERCHANT_LOGINS }}
          GDRIVE_OAUTH_CLIENT: ${{ secrets.GDRIVE_OAUTH_CLIENT }}
          GDRIVE_OAUTH_TOKEN: ${{ secrets.GDRIVE_OAUTH_TOKEN }}
          GOOGLE_DRIVE_PAYNIX_WALLETLOG_FILE_ID: ${{ secrets.GOOGLE_DRIVE_PAYNIX_WALLETLOG_FILE_ID }}
        run: |
          printf '%s' "$ENV_FILE" > .env
          printf '\nGOOGLE_DRIVE_PAYNIX_WALLETLOG_FILE_ID=%s\n' "$GOOGLE_DRIVE_PAYNIX_WALLETLOG_FILE_ID" >> .env
          printf '%s' "$PAYNIX_MERCHANT_LOGINS" > data/paynix-merchant-logins.json
          printf '%s' "$GDRIVE_OAUTH_CLIENT" > data/gdrive-oauth-client.json
          printf '%s' "$GDRIVE_OAUTH_TOKEN" > data/gdrive-oauth-token.json

      # No longer runs download-paynix (the reseller/failed-payout scrape)
      # — download-paynix-wallets now sources its merchants/failedPayouts
      # baseline straight from Drive instead of needing a same-run scrape
      # first. That coupling was the cause of a real bug (2026-08-07):
      # every wallet-alert run was re-scraping and re-uploading failed
      # payouts too, which "consumed" newly-failed payouts before
      # refresh.yml's failed-only alert ever saw them as new. Now this
      # workflow only ever touches wallet top-up data.
      - name: Scrape Paynix wallet top-ups + alert on new/changed requests
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 9 specific merchants' top-up alerts route here instead of the
          # default chat above — see ATMOON_MERCHANT_IDS in
          # telegram-alert.js. Added 2026-08-07.
          TELEGRAM_ATMOON_CHAT_ID: ${{ secrets.TELEGRAM_ATMOON_CHAT_ID }}
          PAYNIX_HEADFUL: 'false'
          TELEGRAM_ALERT_SECTIONS: 'topups'
        run: |
          npm run download-paynix-wallets
          npm run upload-to-drive
          npm run telegram-alert
