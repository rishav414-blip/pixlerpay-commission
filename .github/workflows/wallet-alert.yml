name: Paynix wallet top-up alert

# Fast, frequent check limited to the Paynix side (reseller dashboard +
# per-merchant wallet "Load Requests" logs) so new top-up requests get
# alerted on quickly, without re-running the slow full pipeline (18
# PixlerPay account logins + a 700+ row payout export) every 15 minutes.
# The full data refresh still happens separately every 30 min (refresh.yml).

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

concurrency:
  # Shared with refresh.yml — see the comment there. Both workflows write
  # and upload website/paynix-results.json, so they must never run
  # concurrently. cancel-in-progress stays false: cancelling a run
  # mid-upload could leave Drive with a half-written file.
  group: paynix-pipeline
  cancel-in-progress: false

jobs:
  wallet-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # See refresh.yml for why: caches the Chromium download itself so
      # this fast/frequent (every 10 min) job isn't re-downloading the
      # browser from scratch every cycle.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Write credential files from secrets
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          PAYNIX_MERCHANT_LOGINS: ${{ secrets.PAYNIX_MERCHANT_LOGINS }}
          GDRIVE_OAUTH_CLIENT: ${{ secrets.GDRIVE_OAUTH_CLIENT }}
          GDRIVE_OAUTH_TOKEN: ${{ secrets.GDRIVE_OAUTH_TOKEN }}
        run: |
          printf '%s' "$ENV_FILE" > .env
          printf '%s' "$PAYNIX_MERCHANT_LOGINS" > data/paynix-merchant-logins.json
          printf '%s' "$GDRIVE_OAUTH_CLIENT" > data/gdrive-oauth-client.json
          printf '%s' "$GDRIVE_OAUTH_TOKEN" > data/gdrive-oauth-token.json

      - name: Scrape Paynix + alert on new/changed wallet top-up requests
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAYNIX_HEADFUL: 'false'
          # This is the fast/frequent (every 10 min) tier — only alert on
          # wallet top-ups here. Failed-payout alerts run on their own
          # 30-min cadence from refresh.yml instead.
          TELEGRAM_ALERT_SECTIONS: 'topups'
        run: |
          npm run download-paynix
          npm run download-paynix-wallets
          npm run upload-to-drive
          npm run telegram-alert
