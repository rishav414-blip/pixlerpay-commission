name: Refresh commission data

on:
  schedule:
    # Every 30 minutes. GitHub's scheduler is best-effort and can be
    # delayed under load — fine for this dashboard, not sub-minute precise.
    - cron: '*/30 * * * *'
  workflow_dispatch: {} # manual "Run workflow" button in the Actions tab

concurrency:
  # Shared with wallet-alert.yml so the two workflows never write/upload
  # website/paynix-results.json concurrently — GitHub queues the second
  # run instead of racing two Drive uploads against each other (last
  # upload to finish used to win regardless of which run started later,
  # silently clobbering fresher wallet-log data with a stale scrape).
  group: paynix-pipeline
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Write credential files from secrets
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
          PAYNIX_MERCHANT_LOGINS: ${{ secrets.PAYNIX_MERCHANT_LOGINS }}
          GDRIVE_OAUTH_CLIENT: ${{ secrets.GDRIVE_OAUTH_CLIENT }}
          GDRIVE_OAUTH_TOKEN: ${{ secrets.GDRIVE_OAUTH_TOKEN }}
        run: |
          printf '%s' "$ENV_FILE" > .env
          printf '%s' "$ACCOUNTS_JSON" > data/accounts.json
          printf '%s' "$PAYNIX_MERCHANT_LOGINS" > data/paynix-merchant-logins.json
          printf '%s' "$GDRIVE_OAUTH_CLIENT" > data/gdrive-oauth-client.json
          printf '%s' "$GDRIVE_OAUTH_TOKEN" > data/gdrive-oauth-token.json

      # Split out of a single "npm run all" chain (was: run: npm run all)
      # so a Paynix-side failure can't discard a successful PixlerPay
      # scrape. The old all-or-nothing chain meant an 18-account PixlerPay
      # run that succeeded got thrown away — upload-to-drive and
      # telegram-alert never ran — whenever the later download-paynix step
      # failed (confirmed 2026-08-06: this was happening in ~27% of runs).
      # continue-on-error lets each Paynix-specific step fail independently
      # without stopping the job; upload-to-drive/telegram-alert then run
      # with whatever data did make it to disk (their own existsSync
      # guards already skip any file that's missing).
      - name: Download PixlerPay report
        env:
          PIXLERPAY_HEADFUL: 'false'
        run: npm run download-report

      - name: Calculate PixlerPay commission
        run: npm run calculate

      - name: Download Paynix reseller data
        env:
          PAYNIX_HEADFUL: 'false'
        continue-on-error: true
        run: npm run download-paynix

      - name: Download Paynix merchant wallet logs
        env:
          PAYNIX_HEADFUL: 'false'
        continue-on-error: true
        run: npm run download-paynix-wallets

      - name: Download PixlerPay merchant (Paynix) data
        env:
          PAYNIX_HEADFUL: 'false'
        continue-on-error: true
        run: npm run download-pixlerpay-merchant

      - name: Download Paynix merchant reports
        continue-on-error: true
        run: npm run download-paynix-merchant-reports

      - name: Calculate Paynix commission
        continue-on-error: true
        run: npm run calculate-paynix

      - name: Upload results to Drive
        if: ${{ !cancelled() }}
        run: npm run upload-to-drive

      - name: Send Telegram alert
        if: ${{ !cancelled() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run telegram-alert
