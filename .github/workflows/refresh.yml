name: Refresh commission data

on:
  schedule:
    # Every 30 minutes. GitHub's scheduler is best-effort and can be
    # delayed under load — fine for this dashboard, not sub-minute precise.
    - cron: '*/30 * * * *'
  workflow_dispatch: {} # manual "Run workflow" button in the Actions tab

concurrency:
  # Own group, separate from wallet-alert.yml (was: shared
  # "paynix-pipeline"). That sharing was needed while both workflows
  # scraped and uploaded failed-payout data — now wallet-alert.yml never
  # touches it (see its own comment), so the two no longer need to
  # serialize against each other; doing so was queuing out wallet-alert's
  # frequent (5-min) dispatches behind this workflow's longer runs and
  # getting them cancelled (confirmed 2026-08-07). Still self-serialized
  # against overlapping refresh.yml runs.
  group: refresh-pipeline
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Cache the downloaded Chromium binary itself (keyed to the
      # Playwright version pinned in package-lock.json, so a version bump
      # invalidates it automatically). Every run used to re-download
      # Chromium from scratch on top of npm ci — pure dead time that
      # widens the window for the runner-provisioning/action-resolution
      # flakiness seen 2026-08-06 (GitHub-wide Actions outage) for no
      # benefit, since the browser binary doesn't change between runs.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # On a cache hit the browser binary is already there, but the
      # underlying OS packages (apt) it needs aren't cached — this is
      # fast (no download) so it's cheap to always run.
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # xvfb-run wraps the "Download Paynix merchant reports" step below —
      # not bundled by playwright install-deps, needs its own apt install.
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Write credential files from secrets
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
          PAYNIX_MERCHANT_LOGINS: ${{ secrets.PAYNIX_MERCHANT_LOGINS }}
          GDRIVE_OAUTH_CLIENT: ${{ secrets.GDRIVE_OAUTH_CLIENT }}
          GDRIVE_OAUTH_TOKEN: ${{ secrets.GDRIVE_OAUTH_TOKEN }}
          GOOGLE_DRIVE_PAYNIX_ATMOON_FILE_ID: ${{ secrets.GOOGLE_DRIVE_PAYNIX_ATMOON_FILE_ID }}
          GOOGLE_DRIVE_PAYNIX_ATMOON_COMMISSION_FILE_ID: ${{ secrets.GOOGLE_DRIVE_PAYNIX_ATMOON_COMMISSION_FILE_ID }}
        run: |
          printf '%s' "$ENV_FILE" > .env
          printf '\nGOOGLE_DRIVE_PAYNIX_ATMOON_FILE_ID=%s\n' "$GOOGLE_DRIVE_PAYNIX_ATMOON_FILE_ID" >> .env
          printf 'GOOGLE_DRIVE_PAYNIX_ATMOON_COMMISSION_FILE_ID=%s\n' "$GOOGLE_DRIVE_PAYNIX_ATMOON_COMMISSION_FILE_ID" >> .env
          printf '%s' "$ACCOUNTS_JSON" > data/accounts.json
          printf '%s' "$PAYNIX_MERCHANT_LOGINS" > data/paynix-merchant-logins.json
          printf '%s' "$GDRIVE_OAUTH_CLIENT" > data/gdrive-oauth-client.json
          printf '%s' "$GDRIVE_OAUTH_TOKEN" > data/gdrive-oauth-token.json

      # Split out of a single "npm run all" chain (was: run: npm run all)
      # so a Paynix-side failure can't discard a successful PixlerPay
      # scrape. The old all-or-nothing chain meant an 18-account PixlerPay
      # run that succeeded got thrown away — upload-to-drive and
      # telegram-alert never ran — whenever the later download-paynix step
      # failed (confirmed 2026-08-06: this was happening in ~27% of runs).
      # continue-on-error lets each Paynix-specific step fail independently
      # without stopping the job; upload-to-drive/telegram-alert then run
      # with whatever data did make it to disk (their own existsSync
      # guards already skip any file that's missing).
      - name: Download PixlerPay report
        env:
          PIXLERPAY_HEADFUL: 'false'
        run: npm run download-report

      - name: Calculate PixlerPay commission
        run: npm run calculate

      - name: Download Paynix reseller data
        env:
          PAYNIX_HEADFUL: 'false'
        continue-on-error: true
        run: npm run download-paynix

      # Wallet-log/top-up scraping is now wallet-alert.yml's exclusive
      # responsibility (was: also run here). Both workflows used to write
      # walletLogs into the same shared paynix-results.json — that's fine
      # for walletLogs specifically, but running download-paynix-wallets
      # here too added no value (wallet-alert.yml already covers it on a
      # much faster cadence) while adding scrape time to every refresh run.
      - name: Download PixlerPay merchant (Paynix) data
        env:
          PAYNIX_HEADFUL: 'false'
        continue-on-error: true
        run: npm run download-pixlerpay-merchant

      # This step's chromium.launch() consistently crashed at startup
      # ("Missing X server or $DISPLAY") in CI, 100% reproducible, even
      # though headless:true is passed the same way the three earlier
      # scraping steps launch it. Diagnosed 2026-08-08: unlike those three,
      # this was the only scraping step without a virtual display; wrapping
      # in xvfb-run (as the error itself suggests) gives Chromium a display
      # to fall back to if its headless-mode init misbehaves in this
      # runner's container.
      - name: Download Paynix merchant reports
        env:
          PAYNIX_HEADFUL: 'false'
        continue-on-error: true
        run: xvfb-run -a npm run download-paynix-merchant-reports

      - name: Calculate Paynix commission
        continue-on-error: true
        run: npm run calculate-paynix

      # Filters the reseller + commission data down to the 10 "Atmoon"
      # merchants and strips AK-commission fields, for docs/paynix-atmoon.html
      # (a separate page meant to be shared without exposing the full
      # merchant roster). Runs after the source data exists, before upload.
      - name: Filter Paynix data for Atmoon page
        continue-on-error: true
        run: npm run filter-paynix-atmoon

      - name: Upload results to Drive
        if: ${{ !cancelled() }}
        run: npm run upload-to-drive

      - name: Send Telegram alert
        if: ${{ !cancelled() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # This is the 30-min tier — only alert on failed payouts here.
          # Wallet top-up alerts run on their own 10-min cadence from
          # wallet-alert.yml instead.
          TELEGRAM_ALERT_SECTIONS: 'failed'
        run: npm run telegram-alert
